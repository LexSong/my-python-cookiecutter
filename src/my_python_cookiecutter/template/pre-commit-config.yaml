# A remote hook repo makes pre-commit install its own pinned ruff, which drifts
# from the ruff on PATH, so these hooks are `local`/`system`. A pin per repo
# suits a team that shares one repo. I work alone across many small repos, so
# one ruff on PATH for all of them fits better. It also keeps conform.nvim and
# pre-commit on the same binary. But a ruff update, such as one by topgrade,
# can reformat code nobody touched. So when that happens, check for a ruff
# update before blaming the edit.
repos:
  - repo: local
    hooks:
      # Same args as conform.nvim's ruff_organize_imports, so the nvim keymap
      # and this rewrite a file identically.
      - id: ruff-organize-imports
        name: ruff organize imports
        entry: ruff check --fix --force-exclude --select=I001
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: taplo-format
        name: taplo format
        entry: taplo format
        language: system
        types: [toml]
